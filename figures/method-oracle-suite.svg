<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 165" width="460" height="165" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <defs>
    <!-- Markers -->
    <marker id="orc-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D9488"/>
    </marker>
    <marker id="orc-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>

    <!-- Subtle Shadows -->
    <filter id="orc-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>


  <!-- Panel 1: Invariant Specification -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="122" height="153" rx="7" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1.2"/>
    <rect x="0" y="0" width="122" height="22" rx="7" fill="#CCFBF1"/>
    <rect x="0" y="14" width="122" height="8" fill="#CCFBF1"/>
    <text x="61.0" y="15" fill="#0F766E" font-size="10.5" font-weight="700" text-anchor="middle">Invariant Specification</text>

    <!-- Box 1: Contract φ -->
    <g transform="translate(6, 28)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="110" height="56" rx="5" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1"/>
      <text x="8" y="16" fill="#115E59" font-size="10.5" font-weight="700">Contract (Φ)</text>
      <text x="8" y="32" fill="#64748B" font-size="9.5">Preconditions</text>
      <text x="8" y="47" fill="#0D9488" font-size="9" font-weight="600">Observable Signal</text>
    </g>

    <!-- Box 2: Target ISAs -->
    <g transform="translate(6, 90)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="110" height="55" rx="5" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1"/>
      <text x="8" y="16" fill="#115E59" font-size="10" font-weight="700">Target ISAs (I)</text>
      <rect x="6" y="24" width="98" height="15" rx="3" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="55" y="35" fill="#334155" font-size="8.5" font-weight="700" text-anchor="middle">x86 · ARM · RISC-V</text>
      <text x="8" y="49" fill="#64748B" font-size="8.5">Lowering Semantics</text>
    </g>
  </g>


  <path d="M 130 82 L 152 82" fill="none" stroke="#0D9488" stroke-width="1.6" marker-end="url(#orc-teal)"/>
  <text x="141" y="75" fill="#0D9488" font-size="8.5" font-style="italic" text-anchor="middle">Contract</text>


  <!-- Panel 2: Dual Checkers -->
  <g transform="translate(154, 6)">
    <rect x="0" y="0" width="188" height="153" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="0" y="0" width="188" height="22" rx="7" fill="#F1F5F9"/>
    <rect x="0" y="14" width="188" height="8" fill="#F1F5F9"/>
    <text x="94.0" y="15" fill="#334155" font-size="10.5" font-weight="700" text-anchor="middle">Dual Deterministic Checkers</text>

    <!-- Checker 1: Static Audit -->
    <g transform="translate(6, 26)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="176" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="8" y="15" fill="#0F172A" font-size="10" font-weight="700">Static Audit Checkers</text>
      <text x="8" y="28" fill="#64748B" font-size="8.5">AST, DWARF frames &amp; asm layout</text>
    </g>

    <!-- Checker 2: Dynamic Sandbox -->
    <g transform="translate(6, 68)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="176" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="8" y="15" fill="#0F172A" font-size="10" font-weight="700">Dynamic Sandbox Checkers</text>
      <text x="8" y="28" fill="#64748B" font-size="8.5">Memory traps, canary alerts &amp; signals</text>
    </g>

    <!-- Profiler -->
    <g transform="translate(6, 110)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="176" height="36" rx="5" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
      <text x="8" y="15" fill="#0F766E" font-size="10" font-weight="700">Differential Configuration Profiler</text>
      <text x="8" y="28" fill="#475569" font-size="8.5">Defense-enabled (-O2) vs. Baseline</text>
    </g>
  </g>


  <path d="M 344 82 L 362 82" fill="none" stroke="#0D9488" stroke-width="1.6" marker-end="url(#orc-teal)"/>
  <text x="353" y="75" fill="#0D9488" font-size="8.5" font-style="italic" text-anchor="middle">Verdict</text>


  <!-- Panel 3: Verdict Matrix -->
  <g transform="translate(364, 6)">
    <rect x="0" y="0" width="90" height="153" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="0" y="0" width="90" height="22" rx="7" fill="#F1F5F9"/>
    <rect x="0" y="14" width="90" height="8" fill="#F1F5F9"/>
    <text x="45.0" y="15" fill="#334155" font-size="10.5" font-weight="700" text-anchor="middle">4-State Verdict</text>

    <!-- PASS -->
    <g transform="translate(6, 26)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="78" height="22" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
      <text x="8" y="15" fill="#065F46" font-size="9.5" font-weight="800">PASS</text>
      <text x="42" y="15" fill="#047857" font-size="8">Invariant</text>
    </g>

    <!-- FAIL -->
    <g transform="translate(6, 52)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="78" height="22" rx="4" fill="#FFE4E6" stroke="#F43F5E" stroke-width="1.2"/>
      <text x="8" y="15" fill="#9F1239" font-size="9.5" font-weight="800">FAIL</text>
      <text x="38" y="15" fill="#BE123C" font-size="8" font-weight="700">Silent Bug</text>
    </g>

    <!-- NA -->
    <g transform="translate(6, 78)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="78" height="22" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <text x="8" y="15" fill="#334155" font-size="9.5" font-weight="800">NA</text>
      <text x="30" y="15" fill="#64748B" font-size="7.5">Precond. Unmet</text>
    </g>

    <!-- ERROR -->
    <g transform="translate(6, 104)" filter="url(#orc-shadow)">
      <rect x="0" y="0" width="78" height="22" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
      <text x="6" y="15" fill="#92400E" font-size="8.5" font-weight="800">ERROR</text>
      <text x="45" y="15" fill="#B45309" font-size="7.5">Build Fault</text>
    </g>

    <!-- Zero LLM Badge -->
    <g transform="translate(6, 131)">
      <rect x="0" y="0" width="78" height="16" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="39.0" y="11.5" fill="#059669" font-size="7.5" font-weight="700" text-anchor="middle">0 LLM in Verdict</text>
    </g>
  </g>

</svg>