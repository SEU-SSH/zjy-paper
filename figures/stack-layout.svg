<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
  </defs>


  <!-- Memory Address Axis -->
  <line x1="42" y1="52" x2="42" y2="378" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="42" y1="370" x2="42" y2="384" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-down)"/>
  <text x="42" y="36" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">High Address</text>
  <text x="42" y="408" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">Low Address</text>
  <text x="30" y="215" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle" transform="rotate(-90 30 215)">Stack Grows Down</text>


  <g id="slot-0">
    <rect x="88" y="52" width="232" height="44" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="102" y="72" fill="#334155" font-size="12" font-weight="600">Incoming Stack Arguments</text>
    <text x="102" y="87" fill="#64748B" font-size="10">Caller frame arguments</text>
  </g>

  <g id="slot-1">
    <rect x="88" y="102" width="232" height="44" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="102" y="122" fill="#92400E" font-size="12" font-weight="600">Stack Canary</text>
    <text x="102" y="137" fill="#64748B" font-size="10">Checked at function epilogue</text>
  </g>

  <g id="slot-2">
    <rect x="88" y="152" width="232" height="44" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="102" y="172" fill="#334155" font-size="12" font-weight="600">Local Variables &amp; Spills</text>
    <text x="102" y="187" fill="#64748B" font-size="10">Static arrays &amp; scalars</text>
  </g>

  <g id="slot-3">
    <rect x="88" y="202" width="232" height="44" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="102" y="222" fill="#991B1B" font-size="12" font-weight="600">Saved Return Address (LR')</text>
    <text x="102" y="237" fill="#64748B" font-size="10">Target of control-flow hijack</text>
  </g>

  <g id="slot-4">
    <rect x="88" y="252" width="232" height="44" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="102" y="272" fill="#334155" font-size="12" font-weight="600">Callee-Saved Regs (FP', SVE)</text>
    <text x="102" y="287" fill="#64748B" font-size="10">Frame pointer &amp; vector regs</text>
  </g>

  <g id="slot-5">
    <rect x="88" y="302" width="232" height="44" rx="4" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
    <text x="102" y="322" fill="#9A3412" font-size="12" font-weight="600">VLA / Dynamic Buffer</text>
    <text x="102" y="337" fill="#64748B" font-size="10">Allocated below saved registers</text>
  </g>

  <g id="slot-6">
    <rect x="88" y="352" width="232" height="44" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="102" y="372" fill="#334155" font-size="12" font-weight="600">Outgoing Stack Arguments</text>
    <text x="102" y="387" fill="#64748B" font-size="10">Space reserved for callees</text>
  </g>

  <!-- Overflow trajectory from VLA up to Saved LR' -->
  <path d="M 332 324 C 364 324, 364 224, 338 224" 
        fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-red-up)"/>
  
  <text x="380" y="306" fill="#DC2626" font-size="11.5" font-weight="700">1. Buffer Overflow</text>
  <text x="380" y="320" fill="#991B1B" font-size="10">Grows toward higher addresses</text>
  <text x="380" y="228" fill="#DC2626" font-size="11.5" font-weight="700">Corrupts LR' directly!</text>


  <!-- Canary untouched indicator -->
  <line x1="332" y1="124" x2="378" y2="124" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="380" y="109" width="200" height="30" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="392" y="128" fill="#92400E" font-size="10.5" font-weight="600">2. Canary Sits Above (Intact)</text>


  <!-- Silent Failure Verdict Box -->
  <g transform="translate(380, 336)">
    <rect x="0" y="0" width="200" height="56" rx="5" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="12" y="20" fill="#991B1B" font-size="11.5" font-weight="700">&#9888; Silent Defense Failure</text>
    <text x="12" y="36" fill="#64748B" font-size="9.5">&#x2022; LR' hijacked without crash</text>
    <text x="12" y="48" fill="#64748B" font-size="9.5">&#x2022; Epilogue canary check PASSES</text>
  </g>

</svg>