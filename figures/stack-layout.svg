<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#CC3311"/>
    </marker>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>


  <!-- Memory Address Axis -->
  <line x1="32" y1="46" x2="32" y2="312" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="32" y1="306" x2="32" y2="320" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-down)"/>
  <text x="32" y="36" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle">High Addr</text>
  <text x="32" y="342" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle">Low Addr</text>
  <text x="22" y="180" fill="#64748B" font-size="9.5" font-weight="500" text-anchor="middle" transform="rotate(-90 22 180)">Stack Grows Down</text>


  <g id="slot-0" filter="url(#subtle-shadow)">
    <rect x="76" y="34" width="210" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="88" y="50" fill="#334155" font-size="11" font-weight="700">Incoming Arguments</text>
    <text x="88" y="64" fill="#64748B" font-size="9">Caller frame arguments</text>
  </g>

  <g id="slot-1" filter="url(#subtle-shadow)">
    <rect x="76" y="78" width="210" height="38" rx="4" fill="#FFF8E1" stroke="#F59E0B" stroke-width="2.2"/>
    <text x="88" y="94" fill="#7D4E00" font-size="11" font-weight="700">Stack Canary</text>
    <text x="88" y="108" fill="#92400E" font-size="9">Verified at function epilogue</text>
  </g>

  <g id="slot-2" filter="url(#subtle-shadow)">
    <rect x="76" y="122" width="210" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="88" y="138" fill="#334155" font-size="11" font-weight="700">Local Variables &amp; Spills</text>
    <text x="88" y="152" fill="#64748B" font-size="9">Frame-relative scalar / arrays</text>
  </g>

  <g id="slot-3" filter="url(#subtle-shadow)">
    <rect x="76" y="166" width="210" height="38" rx="4" fill="#F4DFD8" stroke="#CC3311" stroke-width="2.4"/>
    <text x="88" y="182" fill="#7F2615" font-size="11" font-weight="700">Saved Return Address (LR')</text>
    <text x="88" y="196" fill="#991B1B" font-size="9">Target of control-flow hijack</text>
  </g>

  <g id="slot-4" filter="url(#subtle-shadow)">
    <rect x="76" y="210" width="210" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="88" y="226" fill="#334155" font-size="11" font-weight="700">Callee-Saved Regs (FP', SVE)</text>
    <text x="88" y="240" fill="#64748B" font-size="9">Frame pointer &amp; vector context</text>
  </g>

  <g id="slot-5" filter="url(#subtle-shadow)">
    <rect x="76" y="254" width="210" height="38" rx="4" fill="#E3F1E7" stroke="#228833" stroke-width="2.2"/>
    <text x="88" y="270" fill="#195C24" font-size="11" font-weight="700">VLA / Dynamic Buffer</text>
    <text x="88" y="284" fill="#166534" font-size="9">Allocated below saved registers</text>
  </g>

  <g id="slot-6" filter="url(#subtle-shadow)">
    <rect x="76" y="298" width="210" height="38" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="88" y="314" fill="#334155" font-size="11" font-weight="700">Outgoing Arguments</text>
    <text x="88" y="328" fill="#64748B" font-size="9">Reserved space for callees</text>
  </g>

  <!-- Upward Overflow Path -->
  <path d="M 296 273.0 C 330 273.0, 330 185.0, 300 185.0" 
        fill="none" stroke="#CC3311" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrow-red-up)"/>
        
  <!-- Overflow Annotation -->
  <g transform="translate(340, 253.0)">
    <text x="0" y="0" fill="#CC3311" font-size="11" font-weight="700">1. Buffer Overflow</text>
    <text x="0" y="14" fill="#7F2615" font-size="9.5">Grows upward toward higher addr</text>
  </g>

  <!-- Hijack Annotation -->
  <g transform="translate(340, 189.0)">
    <text x="0" y="0" fill="#CC3311" font-size="11" font-weight="700">Clobbers LR' Directly!</text>
    <text x="0" y="14" fill="#64748B" font-size="9">Control flow hijacked on return</text>
  </g>


  <!-- Canary Status Indicator -->
  <line x1="296" y1="97.0" x2="334" y2="97.0" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="338" y="83.0" width="160" height="28" rx="4" fill="#FFF8E1" stroke="#F5A623" stroke-width="1.2"/>
  <text x="348" y="101.0" fill="#7D4E00" font-size="10" font-weight="700">2. Canary Intact (Bypassed!)</text>


  <!-- Verdict Box -->
  <g transform="translate(338, 302)">
    <rect x="0" y="0" width="160" height="34" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
    <text x="10" y="15" fill="#991B1B" font-size="10" font-weight="700">&#x26A0; Silent Defense Failure</text>
    <text x="10" y="27" fill="#64748B" font-size="8.5">Epilogue check PASSES silently</text>
  </g>

</svg>