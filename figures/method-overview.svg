<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1076 276" width="1076" height="276" style="background-color: #FFFFFF; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="5.8" markerHeight="5.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9.2 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="5.8" markerHeight="5.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9.2 5 L 0 8.5 z" fill="#B45309"/>
    </marker>
    <!-- Minimalist academic line-art bot icon (16x16) for LLM-assisted steps -->
    <g id="bot-logo">
      <line x1="8" y1="1.3" x2="8" y2="3.6" stroke="#1E293B" stroke-width="1.25" stroke-linecap="round"/>
      <circle cx="8" cy="1.1" r="1.05" fill="#1E293B"/>
      <line x1="0.9" y1="8.2" x2="2.5" y2="8.2" stroke="#1E293B" stroke-width="1.25" stroke-linecap="round"/>
      <line x1="13.5" y1="8.2" x2="15.1" y2="8.2" stroke="#1E293B" stroke-width="1.25" stroke-linecap="round"/>
      <rect x="2.5" y="3.6" width="11" height="9.2" rx="2.2" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.25"/>
      <circle cx="5.9" cy="7.6" r="1.05" fill="#1E293B"/>
      <circle cx="10.1" cy="7.6" r="1.05" fill="#1E293B"/>
      <line x1="5.8" y1="10.3" x2="10.2" y2="10.3" stroke="#1E293B" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Top Input: Specs, Docs and Patches -->
  <g transform="translate(18, 31)">
    <path d="M 12 0 L 26 0 L 34 8 L 34 30 L 12 30 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 26 0 L 26 8 L 34 8 Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="16" y1="12" x2="30" y2="12" stroke="#1E293B" stroke-width="1.1"/>
    <line x1="16" y1="17" x2="30" y2="17" stroke="#1E293B" stroke-width="1.1"/>
    <line x1="16" y1="22" x2="25" y2="22" stroke="#1E293B" stroke-width="1.1"/>
    <text x="23" y="44" font-size="10.2" font-weight="500" fill="#0F172A" text-anchor="middle">Specs, Docs</text>
    <text x="23" y="57" font-size="10.2" font-weight="500" fill="#0F172A" text-anchor="middle">and Patches</text>
  </g>

  <!-- Bottom Input icon: height=28, placed at y=114 -> spans y=114..142, center y=128 (matches Card 2a center y=128) -->
  <g transform="translate(18, 114)">
    <rect x="10" y="0" width="26" height="28" rx="2.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3"/>
    <text x="23" y="18.5" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">&#123;&#125;</text>
    <text x="23" y="42" font-size="10.2" font-weight="500" fill="#0F172A" text-anchor="middle">Compiler</text>
    <text x="23" y="55" font-size="10.2" font-weight="500" fill="#0F172A" text-anchor="middle">Source Code</text>
  </g>

  <!-- Step 1: Security Invariant Extraction -->
  <g transform="translate(102, 26)">
    <rect x="0" y="0" width="218" height="40" rx="3" fill="#FEF9C3" stroke="#1E293B" stroke-width="1.2"/>
    <use href="#bot-logo" x="9" y="12"/>
    <text x="117" y="17" font-size="10.8" font-weight="700" fill="#0F172A" text-anchor="middle">Security Invariant Extraction</text>
    <text x="117" y="31" font-size="9.5" font-weight="400" fill="#475569" text-anchor="middle">CoT + RAG</text>
  </g>
  <line x1="55" y1="46" x2="100" y2="46" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Step 2: Compiler Source Mapping Container -->
  <g>
    <rect x="92" y="98" width="238" height="140" rx="10" fill="none" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="5,4"/>
    <use href="#bot-logo" x="131" y="214"/>
    <text x="222" y="226" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Compiler Source Mapping</text>
  </g>

  <!-- Card 2a: Call-Graph Analysis (y=112..144, center y=128) -->
  <g transform="translate(104, 112)">
    <rect x="0" y="0" width="214" height="32" rx="3" fill="#FEF9C3" stroke="#1E293B" stroke-width="1.2"/>
    <text x="107" y="20" font-size="10.6" font-weight="700" fill="#0F172A" text-anchor="middle">Call-Graph Analysis</text>
  </g>

  <!-- Card 2b: Hierarchical Branch Mapping (Pass -> Function -> Branch) -->
  <g transform="translate(104, 160)">
    <rect x="0" y="0" width="214" height="38" rx="3" fill="#FEF9C3" stroke="#1E293B" stroke-width="1.2"/>
    <text x="107" y="15.5" font-size="10.6" font-weight="700" fill="#0F172A" text-anchor="middle">Hierarchical Branch Mapping</text>
    <text x="107" y="29.5" font-size="9.4" font-weight="400" fill="#475569" text-anchor="middle">Pass &#8594; Function &#8594; Branch</text>
  </g>

  <line x1="57" y1="128" x2="102" y2="128" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="211" y1="66" x2="211" y2="110" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="218" y="89" font-size="9.5" font-weight="500" fill="#334155">Invariants</text>
  <line x1="211" y1="144" x2="211" y2="158" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Step 3: Programmatic Oracle Construction Container -->
  <g>
    <rect x="370" y="26" width="236" height="212" rx="10" fill="#FEF9C3" stroke="#1E293B" stroke-width="1.2"/>
    <use href="#bot-logo" x="380" y="39"/>
    <text x="496" y="46" font-size="10.8" font-weight="700" fill="#0F172A" text-anchor="middle">Programmatic Oracle Construction</text>
    <text x="496" y="60" font-size="9.5" font-weight="400" fill="#475569" text-anchor="middle">Formally Validated Checkers</text>
    <line x1="382" y1="69" x2="594" y2="69" stroke="#CBD5E1" stroke-width="1"/>
  </g>

  <!-- 3a: Static Audit Checkers -->
  <g transform="translate(384, 84)">
    <rect x="0" y="0" width="208" height="32" rx="3" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
    <text x="104" y="20" font-size="10.6" font-weight="700" fill="#0F172A" text-anchor="middle">Static Audit Checkers</text>
  </g>

  <!-- 3b: Dynamic Sandbox Checkers -->
  <g transform="translate(384, 132)">
    <rect x="0" y="0" width="208" height="32" rx="3" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
    <text x="104" y="20" font-size="10.6" font-weight="700" fill="#0F172A" text-anchor="middle">Dynamic Sandbox Checkers</text>
  </g>

  <!-- 3c: Distinct Rounded Green Capsule for Zero LLM in Adjudication -->
  <g transform="translate(390, 184)">
    <rect x="0" y="0" width="196" height="30" rx="15" fill="#DCFCE7" stroke="#15803D" stroke-width="1.35"/>
    <text x="98" y="19" font-size="10.6" font-weight="700" fill="#14532D" text-anchor="middle">Zero LLM in Adjudication</text>
  </g>

  <line x1="320" y1="46" x2="368" y2="46" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="344" y="39" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Invariants</text>

  <!-- Step 4: Agentic Directed Fuzzing Container -->
  <g>
    <rect x="662" y="14" width="268" height="224" rx="10" fill="none" stroke="#1D4ED8" stroke-width="1.3" stroke-dasharray="5,4"/>
    <text x="796" y="226" font-size="11.2" font-weight="700" fill="#0F172A" text-anchor="middle">Agentic Directed Fuzzing</text>
  </g>

  <!-- Top Card: Targeted Seed Synthesis -->
  <g transform="translate(674, 28)">
    <rect x="0" y="0" width="244" height="38" rx="3" fill="#FEF9C3" stroke="#1E293B" stroke-width="1.2"/>
    <use href="#bot-logo" x="11" y="11"/>
    <text x="124" y="16" font-size="10.8" font-weight="700" fill="#0F172A" text-anchor="middle">Targeted Seed Synthesis</text>
    <text x="124" y="30" font-size="9.5" font-weight="400" fill="#475569" text-anchor="middle">Generator Agent</text>
  </g>

  <!-- Middle Card: Compilation & Oracle Checking (y=94..128, center y=111) -->
  <g transform="translate(674, 94)">
    <rect x="0" y="0" width="244" height="34" rx="3" fill="#F1F5F9" stroke="#1E293B" stroke-width="1.2"/>
    <text x="122" y="21" font-size="10.8" font-weight="700" fill="#0F172A" text-anchor="middle">Compilation &amp; Oracle Checking</text>
  </g>

  <!-- Bottom Card: Guided Seed Mutation -->
  <g transform="translate(674, 156)">
    <rect x="0" y="0" width="244" height="38" rx="3" fill="#FEF9C3" stroke="#1E293B" stroke-width="1.2"/>
    <use href="#bot-logo" x="11" y="11"/>
    <text x="124" y="16" font-size="10.8" font-weight="700" fill="#0F172A" text-anchor="middle">Guided Seed Mutation</text>
    <text x="124" y="30" font-size="9.5" font-weight="400" fill="#475569" text-anchor="middle">Feedback Agent</text>
  </g>

  <!-- Arrows entering Step 4 -->
  <line x1="606" y1="46" x2="672" y2="46" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="634" y="39" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Invariants</text>

  <line x1="606" y1="111" x2="672" y2="111" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="634" y="104" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Checkers</text>

  <!-- Internal Fuzzing Flow -->
  <line x1="796" y1="66" x2="796" y2="92" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="803" y="83" font-size="9.5" font-weight="500" fill="#334155">Seeds</text>

  <line x1="758" y1="128" x2="758" y2="154" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="751" y="145" font-size="9.3" font-weight="500" fill="#334155" text-anchor="end">Branch Traces</text>

  <line x1="834" y1="156" x2="834" y2="130" stroke="#B45309" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="841" y="145" font-size="9.3" font-weight="600" fill="#B45309">Mutated Seeds</text>

  <path d="M 211 238 L 211 260 L 796 260 L 796 240" fill="none" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="503" y="254" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">Call Graph &amp; Mapped Branches</text>

  <line x1="918" y1="111" x2="978" y2="111" stroke="#1E293B" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="948" y="103" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">FAIL</text>

  <g transform="translate(980, 92)">
    <path d="M 12 0 L 26 0 L 34 8 L 34 38 L 12 38 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M 26 0 L 26 8 L 34 8 Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="1.2" stroke-linejoin="round"/>
    <ellipse cx="23" cy="22" rx="4.5" ry="5.5" fill="#DC2626"/>
    <circle cx="23" cy="15" r="2.5" fill="#DC2626"/>
    <line x1="16" y1="19" x2="30" y2="19" stroke="#DC2626" stroke-width="1.1"/>
    <line x1="15" y1="23" x2="31" y2="23" stroke="#DC2626" stroke-width="1.1"/>
    <line x1="16" y1="27" x2="30" y2="27" stroke="#DC2626" stroke-width="1.1"/>
    <line x1="21" y1="13" x2="19" y2="10" stroke="#DC2626" stroke-width="1.1"/>
    <line x1="25" y1="13" x2="27" y2="10" stroke="#DC2626" stroke-width="1.1"/>

    <text x="23" y="53" font-size="10.8" font-weight="700" fill="#0F172A" text-anchor="middle">Silent Defense</text>
    <text x="23" y="66" font-size="10.8" font-weight="700" fill="#0F172A" text-anchor="middle">Bugs</text>
  </g>
</svg>