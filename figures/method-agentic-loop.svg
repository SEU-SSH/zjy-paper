<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <defs>
    <!-- Markers -->
    <marker id="loop-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="loop-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="loop-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="loop-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7E22CE"/>
    </marker>

    <!-- Subtle Shadows -->
    <filter id="loop-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>


  <!-- Module 1: Target Scheduler -->
  <g transform="translate(6, 8)" filter="url(#loop-shadow)">
    <rect x="0" y="0" width="94" height="50" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
    <text x="8" y="18" fill="#334155" font-size="9.5" font-weight="700">Scheduler</text>
    <text x="8" y="32" fill="#64748B" font-size="8">Lock Invariant φi</text>
    <text x="8" y="43" fill="#94A3B8" font-size="7.5">Uniform Budget T</text>
  </g>


  <line x1="102" y1="33" x2="118" y2="33" stroke="#2563EB" stroke-width="1.4" marker-end="url(#loop-blue)"/>
  <text x="110" y="27" fill="#2563EB" font-size="7.5" font-style="italic" text-anchor="middle">φi</text>


  <!-- Module 2: Generator Agent -->
  <g transform="translate(120, 8)" filter="url(#loop-shadow)">
    <rect x="0" y="0" width="104" height="50" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.1"/>
    <text x="8" y="18" fill="#1E40AF" font-size="9.5" font-weight="700">Generator Agent</text>
    <text x="8" y="32" fill="#64748B" font-size="8">Anti-DCE C Probes</text>
    <text x="8" y="43" fill="#2563EB" font-size="7.5">Layout Preserved</text>
  </g>


  <line x1="226" y1="33" x2="242" y2="33" stroke="#2563EB" stroke-width="1.4" marker-end="url(#loop-blue)"/>
  <text x="234" y="27" fill="#2563EB" font-size="7.5" font-style="italic" text-anchor="middle">Seeds</text>


  <!-- Module 3: Compiler Driver -->
  <g transform="translate(244, 8)" filter="url(#loop-shadow)">
    <rect x="0" y="0" width="104" height="50" rx="5" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.1"/>
    <text x="8" y="18" fill="#0F766E" font-size="9.5" font-weight="700">Driver (GCC_INST)</text>
    <text x="8" y="32" fill="#64748B" font-size="8">Multi-ISA Matrix</text>
    <text x="8" y="43" fill="#0D9488" font-size="7.5">Emits UID Traces</text>
  </g>


  <line x1="350" y1="33" x2="364" y2="33" stroke="#0F766E" stroke-width="1.4" marker-end="url(#loop-blue)"/>
  <text x="357" y="27" fill="#0F766E" font-size="7.5" font-style="italic" text-anchor="middle">Binary</text>


  <!-- Module 4: Deterministic Oracle -->
  <g transform="translate(366, 8)" filter="url(#loop-shadow)">
    <rect x="0" y="0" width="88" height="50" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
    <text x="8" y="16" fill="#0F172A" font-size="9" font-weight="700">Oracle Checkers</text>
    <!-- Mini Pills -->
    <g transform="translate(5, 23)">
      <rect x="0" y="0" width="36" height="11" rx="2" fill="#D1FAE5"/>
      <text x="18" y="8.5" fill="#065F46" font-size="7" font-weight="700" text-anchor="middle">PASS</text>
      <rect x="40" y="0" width="36" height="11" rx="2" fill="#FFE4E6"/>
      <text x="58" y="8.5" fill="#9F1239" font-size="7" font-weight="700" text-anchor="middle">FAIL</text>
    </g>
    <g transform="translate(5, 36)">
      <rect x="0" y="0" width="36" height="10" rx="2" fill="#F1F5F9"/>
      <text x="18" y="8" fill="#475569" font-size="6.5" font-weight="700" text-anchor="middle">NA</text>
      <rect x="40" y="0" width="36" height="10" rx="2" fill="#FEF3C7"/>
      <text x="58" y="8" fill="#92400E" font-size="6.5" font-weight="700" text-anchor="middle">ERROR</text>
    </g>
  </g>


  <path d="M 410 58 L 410 82" fill="none" stroke="#DC2626" stroke-width="1.6" marker-end="url(#loop-red)"/>
  <text x="424" y="73" fill="#DC2626" font-size="8" font-weight="800">FAIL</text>


  <!-- Minimizer Agent -->
  <g transform="translate(244, 84)" filter="url(#loop-shadow)">
    <rect x="0" y="0" width="210" height="54" rx="5" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.1"/>
    <text x="8" y="16" fill="#9F1239" font-size="9.5" font-weight="700">Minimizer &amp; Lateral Agent</text>
    <text x="8" y="29" fill="#BE123C" font-size="8">C-Reduce Delta Debugging + PoC Validation</text>
    <rect x="6" y="34" width="198" height="15" rx="3" fill="#FFE4E6"/>
    <text x="105" y="45" fill="#E11D48" font-size="8" font-weight="700" text-anchor="middle">⇒ Verified Zero-Day PoC (.c)</text>
  </g>


  <path d="M 390 58 L 390 70 L 115 70 L 115 82" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#loop-gray)"/>
  <text x="250" y="67" fill="#64748B" font-size="7.5" font-style="italic" text-anchor="middle">PASS / NA / ERROR</text>


  <!-- Adaptive Feedback Agent -->
  <g transform="translate(6, 84)" filter="url(#loop-shadow)">
    <rect x="0" y="0" width="224" height="54" rx="5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.1"/>
    <text x="8" y="16" fill="#1E40AF" font-size="9.5" font-weight="700">Adaptive Feedback Agent</text>
    <text x="8" y="29" fill="#64748B" font-size="8">UID hit logs &amp; compiler diagnostics telemetry</text>
    <!-- 2 Sub-pills -->
    <rect x="6" y="34" width="102" height="15" rx="2.5" fill="#EFF6FF"/>
    <text x="57" y="44.5" fill="#2563EB" font-size="7" font-weight="600" text-anchor="middle">Guidance (syntactic)</text>
    <rect x="112" y="34" width="104" height="15" rx="2.5" fill="#FAF5FF"/>
    <text x="164" y="44.5" fill="#7E22CE" font-size="7" font-weight="600" text-anchor="middle">Checker Rewrite</text>
  </g>


  <path d="M 172 84 L 172 62" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#loop-blue)"/>


  <!-- Versioned Blackboard -->
  <g transform="translate(6, 152)" filter="url(#loop-shadow)">
    <rect x="0" y="0" width="448" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
    <rect x="0" y="0" width="448" height="18" rx="6" fill="#F1F5F9"/>
    <rect x="0" y="12" width="448" height="6" fill="#F1F5F9"/>
    <text x="224" y="13" fill="#334155" font-size="9" font-weight="700" text-anchor="middle">Deterministic Versioned Blackboard (B)</text>
    
    <!-- Lifecycle steps -->
    <g transform="translate(14, 25)">
      <rect x="0" y="0" width="86" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="43" y="12.5" fill="#475569" font-size="7.5" font-weight="600" text-anchor="middle">1. Seed Gen</text>

      <line x1="88" y1="9" x2="104" y2="9" stroke="#94A3B8" stroke-width="1" marker-end="url(#loop-gray)"/>

      <rect x="106" y="0" width="94" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="153" y="12.5" fill="#475569" font-size="7.5" font-weight="600" text-anchor="middle">2. GCC_INST Build</text>

      <line x1="202" y1="9" x2="218" y2="9" stroke="#94A3B8" stroke-width="1" marker-end="url(#loop-gray)"/>

      <rect x="220" y="0" width="90" height="18" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="265" y="12.5" fill="#475569" font-size="7.5" font-weight="600" text-anchor="middle">3. Trace &amp; Verdict</text>

      <line x1="312" y1="9" x2="328" y2="9" stroke="#94A3B8" stroke-width="1" marker-end="url(#loop-gray)"/>

      <rect x="330" y="0" width="86" height="18" rx="3" fill="#FFE4E6" stroke="#FDA4AF"/>
      <text x="373" y="12.5" fill="#9F1239" font-size="7.5" font-weight="700" text-anchor="middle">4. PoC Output</text>
    </g>
  </g>

</svg>